spring:
  application:
    name: configserver
  profiles:
    active: native
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  cloud:
    config:
      server:
        native:
#          search-locations: classpath:/config
          search-locations: file:///D:\Workspace\microservice\configserver\src\main\resources\config

server:
  port: 8888
